# PayPal Configuration
# Add these to your application.properties file

# PayPal API Credentials (Sandbox for testing)
paypal.client.id=YOUR_PAYPAL_CLIENT_ID
paypal.client.secret=YOUR_PAYPAL_CLIENT_SECRET

# Mode: sandbox (for testing) or live (for production)
paypal.mode=sandbox

# Redirect URLs after payment
paypal.success.url=http://localhost:4200/payment-success
paypal.cancel.url=http://localhost:4200/payment-cancel

# How to get PayPal credentials:
# 1. Go to https://developer.paypal.com/
# 2. Log in with your PayPal account
# 3. Go to "Dashboard" > "My Apps & Credentials"
# 4. Create a new app or use existing one
# 5. Copy Client ID and Secret
# 6. For testing, use Sandbox credentials
# 7. For production, switch to Live credentials and set paypal.mode=live

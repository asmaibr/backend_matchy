server.port=8091
spring.application.name=api-gateway

# ---- EUREKA ----
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- DISCOVERY LOCATOR ----
spring.cloud.gateway.discovery.locator.enabled=false

# ---- ROUTES ----

# [0] Users list - public GET (for admin tools like certification assignment)
spring.cloud.gateway.routes[0].id=users-list-public
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users
spring.cloud.gateway.routes[0].predicates[1]=Method=GET

# [1] Auth public - user-service (NO JWT)
spring.cloud.gateway.routes[1].id=auth-public
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/login,/api/auth/register,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/google,/api/auth/google/callback

# [2] Users + Auth - user-service (JWT protected)
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthFilter

# [3] Wallet + Badges - user-service
spring.cloud.gateway.routes[3].id=wallet-badge-service
spring.cloud.gateway.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/wallet/**,/api/badges/**,/api/gamification/**
spring.cloud.gateway.routes[3].predicates[1]=Method=GET
spring.cloud.gateway.routes[3].filters[0]=JwtAuthFilter

# [4] Projects + Categories - backend monolith
spring.cloud.gateway.routes[4].id=project-service
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/projects/**,/api/categories/**

# [5] Proposals - backend monolith
spring.cloud.gateway.routes[5].id=proposal-service
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/proposals/**

# [6] Notifications + WebSocket - backend monolith (NO JWT)
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=http://localhost:8082
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**,/ws/**

# [7] Matching - backend monolith
spring.cloud.gateway.routes[7].id=matching-service
spring.cloud.gateway.routes[7].uri=http://localhost:8082
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/matching/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthFilter

# [8] Predictions + AI + Chat - backend monolith
spring.cloud.gateway.routes[8].id=ai-prediction-service
spring.cloud.gateway.routes[8].uri=http://localhost:8082
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/predictions/**,/api/ai/**,/api/chat/**
spring.cloud.gateway.routes[8].filters[0]=JwtAuthFilter

# [9] FreelancerStats - backend monolith (NO JWT)
spring.cloud.gateway.routes[9].id=freelancer-stats-service
spring.cloud.gateway.routes[9].uri=http://localhost:8082
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/freelancers/**,/api/profiles/**,/api/availability/**,/api/market/**,/api/freelancer/**,/api/stats/**

# [10] Content Service (NO JWT)
spring.cloud.gateway.routes[10].id=content-service
spring.cloud.gateway.routes[10].uri=http://localhost:8081
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/Content/**

# [11] Assessment Service (NO JWT)
spring.cloud.gateway.routes[11].id=assessment-service
spring.cloud.gateway.routes[11].uri=http://localhost:8081
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/Assessment/**

# [12] Certification Service (NO JWT)
spring.cloud.gateway.routes[12].id=certification-service
spring.cloud.gateway.routes[12].uri=http://localhost:8081
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/Certification/**

# [13] Favorite Service (NO JWT)
spring.cloud.gateway.routes[13].id=favorite-service
spring.cloud.gateway.routes[13].uri=http://localhost:8081
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/Favorite/**

# [14] Translation Service (NO JWT)
spring.cloud.gateway.routes[14].id=translation-service
spring.cloud.gateway.routes[14].uri=http://localhost:8081
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/Translation/**

# [15] Content User Service (NO JWT) - for syncing users to content_db
spring.cloud.gateway.routes[15].id=content-user-service
spring.cloud.gateway.routes[15].uri=http://localhost:8081
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/User/**

# ---- CORS ----
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ---- JWT ----
jwt.secret=matchySecretKey2024VeryLongAndSecureKeyForJWTSigning

# ---- ACTUATOR ----
management.endpoints.web.exposure.include=*

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

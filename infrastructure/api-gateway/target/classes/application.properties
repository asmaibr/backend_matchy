server.port=8091
spring.application.name=api-gateway

# ---- EUREKA ----
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- DISCOVERY LOCATOR ----
spring.cloud.gateway.discovery.locator.enabled=false

# ---- ROUTES ----

# Auth public - user-service (NO JWT)
spring.cloud.gateway.routes[0].id=auth-public
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/login,/api/auth/register,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/google,/api/auth/google/callback

# Users + Auth - user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthFilter

# Wallet + Badges - user-service
spring.cloud.gateway.routes[2].id=wallet-badge-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/wallet/**,/api/badges/**,/api/gamification/**
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.routes[2].filters[0]=JwtAuthFilter

# Projects + Categories - backend monolith
spring.cloud.gateway.routes[3].id=project-service
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/projects/**,/api/categories/**

# Proposals - backend monolith
spring.cloud.gateway.routes[4].id=proposal-service
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/proposals/**

# Notifications + WebSocket - backend monolith (NO JWT)
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**,/ws/**

# Matching - backend monolith
spring.cloud.gateway.routes[6].id=matching-service
spring.cloud.gateway.routes[6].uri=http://localhost:8082
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/matching/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthFilter

# Predictions + AI + Chat - backend monolith
spring.cloud.gateway.routes[7].id=ai-prediction-service
spring.cloud.gateway.routes[7].uri=http://localhost:8082
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/predictions/**,/api/ai/**,/api/chat/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthFilter

# FreelancerStats - backend monolith (NO JWT)
spring.cloud.gateway.routes[8].id=freelancer-stats-service
spring.cloud.gateway.routes[8].uri=http://localhost:8082
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/freelancers/**,/api/profiles/**,/api/availability/**,/api/market/**,/api/freelancer/**,/api/stats/**

# ---- CORS ----
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ---- JWT ----
jwt.secret=matchySecretKey2024VeryLongAndSecureKeyForJWTSigning

# ---- ACTUATOR ----
management.endpoints.web.exposure.include=*

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
